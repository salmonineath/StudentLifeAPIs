spring.application.name=StudentLifeAPIs

# Schema management: keeps `update` for local dev by default, but prod should run
# with SPRING_JPA_DDL_AUTO=validate once a Flyway/Liquibase baseline exists.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
# SQL logging off by default (perf + log noise + info leak); enable in dev via env.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=5000

#spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jwt-secret=${SPRING_JWT_SECRET}
spring.access-token-expire=${SPRING_ACCESS_TOKEN_EXPIRE}
spring.refresh-token-expire=${SPRING_REFRESH_TOKEN_EXPIRE}

#app.secure-cookie=false
app.secure-cookie=true
server.forward-headers-strategy=FRAMEWORK

# Multipart file upload settings
#spring.servlet.multipart.enabled=true
#spring.servlet.multipart.max-file-size=5MB
#spring.servlet.multipart.max-request-size=10MB

# Custom property for your upload directory
#file.upload-dir=uploads

#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#
#spring.security.oauth2.client.registration.google.scope=profile,email

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#app.frontend.url=http://localhost:3000
#app.frontend.url=https://student-life-platform.vercel.app
# Temporary: invite emails + post-accept/decline redirects target the staging
# frontend. Override with APP_FRONTEND_URL env to switch back to production.
app.frontend.url=${APP_FRONTEND_URL:https://studentlife-meta-version.vercel.app}
app.backend.url=https://studentlifeapis.onrender.com

# WebSocket is auto-configured, but good to define your broker settings
spring.websocket.path=/ws

#admin credential
spring.admin.username=${SPRING_ADMIN_USERNAME}
spring.admin.email=${SPRING_ADMIN_EMAIL}
spring.admin.password=${SPRING_ADMIN_PASSWORD}

#agent credential
logging.level.org.hibernate=ERROR
logging.level.com.rental=DEBUG
# Never leak internal messages/stack traces to clients by default (security).
# Errors are still logged server-side and returned via the standard ApiResponse shape.
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}

groq.api.key=${SPRING_GROQ_API_KEY}
spring.jackson.serialization.write-dates-as-timestamps=false

# OneSignal
onesignal.app-id=${ONESIGNAL_APP_ID}
onesignal.api-key=${ONESIGNAL_API_KEY}